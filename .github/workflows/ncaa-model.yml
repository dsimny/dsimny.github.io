# NCAA basketball model (ncaa-model/): tests, plus the CBBD steps, which need
# the CBBD_API_KEY secret. Posts nothing. Raw CBBD rows never leave the runner
# (public repo, and the feed is not ours to redistribute). The only write is
# one derived team-level table committed to the PR branch (see that step);
# reports carry aggregates only.
name: NCAA model

on:
  pull_request:
    paths:
      - "ncaa-model/**"
      - ".github/workflows/ncaa-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-cbbd:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to commit data/derived/team_priors.csv to the PR branch
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ncaa-model
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Download box scores and schedules
        run: python -m ncaa.ingest
      - name: CBBD roster/transfer/recruiting team aggregates
        run: python -m ncaa.cbbd_roster features --seasons 2016-2027
      # The one derived table (team-level aggregates, no player rows) is
      # committed back to the PR branch so the backtest reproduces without a
      # key and later runs spend no CBBD calls. Raw CBBD JSON stays here.
      - name: Commit derived team aggregates to the PR branch
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          f=ncaa-model/data/derived/team_priors.csv
          [ -f "$f" ] || { echo "no derived table"; exit 0; }
          cp "$f" "$RUNNER_TEMP/team_priors.csv"
          git fetch origin "$HEAD_REF"
          git checkout -f -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p ncaa-model/data/derived
          cp "$RUNNER_TEMP/team_priors.csv" "$f"
          git add "$f"
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ncaa-model: derived team priors from CBBD (team-level aggregates)"
          git push origin "HEAD:$HEAD_REF"

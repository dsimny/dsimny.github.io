name: Morning board
# Target is 15:10 UTC (11:10 AM ET in summer): after probable pitchers and
# morning lines are posted, well before the earliest first pitch.
#
# Three windows, not one. GitHub's cron is best-effort and ran the grading job
# five hours late on 2026-07-22; a delay like that would push the board past
# first pitch. Whichever window fires first builds the board, and the rest exit
# immediately because a commitment already exists for the date. The engine also
# refuses to publish any game that has already started, so a very late run
# produces a short board or none at all rather than a dishonest one.
on:
  # Triggered by cron-job.org via the workflow_dispatch API, daily at 11:10 AM ET.
  # GitHub's own cron was removed 2026-07-23: it fired HOURS late and, worse,
  # each late run re-posted the free pick and members board to Discord (the
  # idempotency guard blocks a rebuild, not a re-post), spamming duplicates.
  # cron-job.org fires once, on time. This is also the manual "Run workflow" button.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    # Every step here either writes or reads the encrypted board, so the key is
    # set once for the job rather than repeated five times.
    env:
      BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional — board runs without it
          # Only used to warn when The Odds API balance drops under the floor.
          # An exhausted feed no longer surprises us: the board still publishes,
          # with model fair lines and no market gates, and the site says so.
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}     # optional — ops channel
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}   # fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                   # last-resort fallback
        run: python scripts/fetch_data.py
      - name: Run engine (10,000 sims/game + circuit breakers)
        run: python scripts/engine.py
      - name: Build site
        env:
          DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}   # optional — join prompt is omitted when unset
          WHOP_CHECKOUT_URL: ${{ vars.WHOP_CHECKOUT_URL }}   # optional — upgrade button omitted when unset
        run: python scripts/build_site.py
      - name: Post free pick to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # optional
          SITE_URL: ${{ vars.SITE_URL }}                            # optional
        run: python scripts/post_discord.py pick
      - name: Post held plays to the members channel
        env:
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}   # optional
          SITE_URL: ${{ vars.SITE_URL }}                                            # optional
        run: python scripts/post_discord.py board
      - name: Email the free pick to subscribers
        # Reads data/feed_items.json (written by Build site above), so the email
        # is byte-for-byte the free pick. Unlike the Discord posts this is
        # idempotent: it records "sent" in data/post_status.json and refuses to
        # re-send that date, so a repeat run never double-mails the list. Skips
        # cleanly if the key or segment is unset; never fails the board.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}       # optional — email skipped when unset
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}    # optional — all-subscribers segment
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}                  # optional — defaults to picks@send.openledgersports.com
        run: python scripts/send_email.py pick
      - name: Write The Morning Line (daily blog)
        # Deterministic post composed from the same board the site renders —
        # the slate on game days, the evergreen library on off days. Idempotent
        # by date; also regenerates feed.xml with the blog item merged in.
        env:
          SITE_URL: ${{ vars.SITE_URL }}   # optional — links default to the apex
        run: python scripts/blog.py
      - name: Build game pages (board-day versions)
        # One permanent URL per game. Today's board is loaded via crypto_box
        # (key in the job env) but held plays render REDACTED: reveal state is
        # detected from the plaintext board file, which doesn't exist until
        # grading writes it.
        run: python scripts/game_pages.py
      - name: Rebuild the odds-movement page
        # At board time today has no captures yet, so this renders the most
        # recent captured slate; the first capture run (~11:30 ET) flips it.
        run: python scripts/odds_page.py
      - name: Post the blog link to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # optional
          SITE_URL: ${{ vars.SITE_URL }}                            # optional
        run: python scripts/post_discord.py blog
      - name: Post the pick'em featured game
        # "Beat the Engine": free pick or Best of Board, two buttons. Skips
        # cleanly until the bot token + channel id secrets exist.
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}     # optional — pick'em dark until set
          PICKEM_CHANNEL_ID: ${{ vars.PICKEM_CHANNEL_ID }}        # optional
          SITE_URL: ${{ vars.SITE_URL }}                          # optional
        run: python scripts/post_pickem.py
      - name: Commit board and site
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html feed.xml blog/ picks/ odds/
          git diff --cached --quiet || git commit -m "Board $(date -u +%F)"
          git push

  # A failed morning run has to reach a human the same day. Before 2026-08-17
  # nothing did: the board job could go red (or, that day, never start at all)
  # and the only trace was a line in the Actions tab nobody was watching, while
  # the site quietly kept serving the previous day's picks.
  #
  # This job covers the "it ran and broke" half. The "it never started" half is
  # structurally uncatchable here — a job that never starts cannot fail — and is
  # covered by heartbeat.yml instead.
  alert:
    needs: board
    # always() so this still fires when the board job is CANCELLED or killed by
    # the runner, not only when a step exits non-zero.
    if: ${{ always() && needs.board.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # naming the failing step + reading its log tail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}     # optional — ops channel
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}   # fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                   # last-resort fallback
        run: |
          # Every lookup below is best-effort: an alert that says less is fine,
          # an alert that fails to send is not. Hence set +e and the || true.
          set +e
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # gh's built-in --jq, not the standalone jq binary: one less thing that
          # can be missing on a runner and silently blank out the alert.
          Q_STEP='[.jobs[] | select(.name != "alert") | .steps[]? | select(.conclusion == "failure") | .name][0] // "unknown (no failing step reported)"'
          Q_JOB='[.jobs[] | select(.name != "alert") | select(.conclusion != "success") | .id][0] // empty'
          RUN_JOBS="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          STEP=$(gh api "$RUN_JOBS" --jq "$Q_STEP" 2>/dev/null)
          JOB_ID=$(gh api "$RUN_JOBS" --jq "$Q_JOB" 2>/dev/null)
          [ -n "$STEP" ] || STEP="unknown (could not read the run's jobs)"
          : > tail.txt
          if [ -n "$JOB_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > joblog.txt 2>/dev/null \
              && tail -n 20 joblog.txt > tail.txt
          fi
          python scripts/post_discord.py alert \
            "**Morning board did not complete.** Failing step: \`$STEP\`. Run: $RUN_URL
          Today's board may not have published. The site shows its staleness banner until a board for today lands; the ledger is untouched." \
            --detail-file tail.txt
          exit 0

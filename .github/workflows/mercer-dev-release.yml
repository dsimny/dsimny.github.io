name: Mercer developmental release
# Human-approved release of ONE sealed D.J. Mercer developmental play.
# docs/MERCER_DEVELOPMENTAL_RELEASE_CONTROLS.md is the operating manual.
#
# DISPATCH ONLY. No schedule, no push trigger: a play reaches members only when
# an approver runs this with the play id AND the full artifact SHA-256 they
# reviewed in the private preview. That pair IS the approval, and the approver
# is the GitHub account that dispatched the run (checked against the repository
# variable MERCER_DEV_APPROVERS).
#
# NOTHING PUBLISHES UNLESS ALL OF THESE HOLD: a REGISTERED, effective strategy;
# data/mercer_dev/control.json enabled for the sport; repository variable
# MERCER_DEV_PUBLICATION=enabled; every release check passes against a fresh
# ESPN event and a fresh odds quote. Kill switch: set MERCER_DEV_PUBLICATION to
# anything else. That stops this workflow only - MLB, grading, capture, the
# site and the Mercer Spotlight are untouched.
#
# PUBLIC LOGS. This repository's Actions logs are public. The scripts print
# check names and PASS/FAIL only; previews go to the private review webhook.
#
# NEVER RE-RUN a failed or uncertain publish. mercer_dev.py refuses any attempt
# other than the first, and an uncertain delivery leaves a reservation that
# blocks every later attempt until a human checks the channel.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview (review channel only) | commission (offline, never posts) | dry-run | publish"
        required: true
        type: choice
        options: [preview, commission, dry-run, publish]
      play_id:
        description: "Play id, e.g. mercer-nfl-dev-v1-401999001-spread"
        required: true
        type: string
      artifact_sha256:
        description: "Full SHA-256 of the artifact you reviewed (publish and dry-run)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mercer-dev-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # The release checks compare the sealed artifact and its commitment with
      # what is on origin/main, so that ref must exist and be current.
      - name: Fetch origin/main for the public-commitment check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Preview to the private review channel
        if: ${{ inputs.action == 'preview' }}
        env:
          PYTHONIOENCODING: utf-8
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          DISCORD_WEBHOOK_URL_MERCER_REVIEW: ${{ secrets.DISCORD_WEBHOOK_URL_MERCER_REVIEW }}
          PLAY_ID: ${{ inputs.play_id }}
        run: python scripts/mercer_dev/mercer_dev.py preview --play-id "$PLAY_ID"

      # COMMISSIONING. The whole chain - real sealed artifact, real public
      # commitment, fresh ESPN event and odds, approval, reservation, send,
      # read-back, receipt - against an offline double. No webhook secret is
      # given to this step, the double refuses any real URL, and it writes
      # nothing to the repository. The kill switch is expected to be OFF.
      - name: Commission the release chain offline
        if: ${{ inputs.action == 'commission' }}
        env:
          PYTHONIOENCODING: utf-8
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MERCER_DEV_PUBLICATION: ${{ vars.MERCER_DEV_PUBLICATION }}
          MERCER_DEV_APPROVERS: ${{ vars.MERCER_DEV_APPROVERS }}
          PLAY_ID: ${{ inputs.play_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
        run: python scripts/mercer_dev/mercer_dev.py commission --play-id "$PLAY_ID" --sha "$ARTIFACT_SHA"

      - name: Release checks without sending
        if: ${{ inputs.action == 'dry-run' }}
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ github.token }}
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MERCER_DEV_PUBLICATION: ${{ vars.MERCER_DEV_PUBLICATION }}
          MERCER_DEV_APPROVERS: ${{ vars.MERCER_DEV_APPROVERS }}
          PLAY_ID: ${{ inputs.play_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
        run: python scripts/mercer_dev/mercer_dev.py publish --play-id "$PLAY_ID" --sha "$ARTIFACT_SHA" --dry-run

      - name: Publish the approved artifact
        if: ${{ inputs.action == 'publish' }}
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ github.token }}
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL_MERCER_PLAYS: ${{ secrets.DISCORD_WEBHOOK_URL_MERCER_PLAYS }}
          MERCER_DEV_PUBLICATION: ${{ vars.MERCER_DEV_PUBLICATION }}
          MERCER_DEV_APPROVERS: ${{ vars.MERCER_DEV_APPROVERS }}
          PLAY_ID: ${{ inputs.play_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
        run: python scripts/mercer_dev/mercer_dev.py publish --play-id "$PLAY_ID" --sha "$ARTIFACT_SHA"

      # The fresh odds quote spends 3 credits and writes a reading to
      # data/odds_credits.json through scripts/odds_credits.py. An unstaged
      # reading dies with the runner, so it is committed here - counters and
      # timestamps only. Runs after a refused or failed publish too, because
      # the quote was still paid for.
      - name: Commit the credit reading
        if: ${{ !cancelled() && inputs.action != 'preview' }}
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds_credits.json
          git diff --cached --quiet || git commit -m "Mercer dev credit reading $(date -u +%FT%TZ)"
          PUSH_WHAT="mercer dev credit reading"
          pushed=""
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git fetch origin main || exit 1
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase conflict during the $PUSH_WHAT push - stopping, not auto-resolving"
              exit 1
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error::$PUSH_WHAT push still rejected after 3 rebase attempts - nothing was pushed"
            exit 1
          fi

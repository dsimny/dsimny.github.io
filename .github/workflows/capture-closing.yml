name: Capture closing lines
# Captures the current market line for today's slate into data/closing_<date>.json
# for CLV tracking (roadmap item 2). Meant to run SEVERAL times a day via its own
# cron-job.org triggers — each run updates only games that have NOT started yet,
# so every game ends up stored at the last line seen before its first pitch (its
# close). The nightly grader reads the file and books open-vs-close per pick.
#
# Suggested cron-job.org triggers (workflow_dispatch API, like the other two jobs):
#   ~11:30 AM ET  (day-game closes)
#   ~ 6:45 PM ET  (evening-game closes)
#   ~ 9:15 PM ET  (late West Coast closes)
# More runs = tighter closes; a missed run just means a slightly earlier line.
#
# Needs ODDS_API_KEY only — it re-fetches the schedule from the MLB Stats API and
# never reads the encrypted board, so no BOARD_ENCRYPTION_KEY here. With the key
# unset the script no-ops and CLV stays blank (no failure).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Capture current lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # required for capture; no-ops cleanly if unset
        run: python scripts/fetch_closing.py
      - name: Rebuild the odds-movement page
        # Reads only closing_*.json (and revealed boards for legacy names) —
        # no key needed, nothing model-derived on the page.
        run: python scripts/odds_page.py
      - name: Commit closing lines
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          # NO `git pull` HERE. It used to run at this point, BEFORE staging,
          # so the tree was dirty by construction and needed --autostash to move
          # at all. That hid two failures rather than one:
          # `git pull --rebase --autostash` EXITS 0 when the rebase succeeds but
          # the stash pop conflicts, leaving UU conflict markers in the working
          # tree and the stash undropped - so `|| true` was not even the thing
          # swallowing it. The step then staged, committed and pushed the markers
          # to main. Verified against real git in a scratch repo, and pinned by
          # scripts/football/selftest_push_pattern.py.
          # Sync happens in the push epilogue below instead, AFTER the commit,
          # when the tree is clean and a rebase needs nothing hidden.
          # odds_credits.json too: fetch_closing.py writes a credit reading every
          # run, but without staging it here the runner is torn down and the
          # reading is lost. This job spends 6 of the 8 daily credits (3 runs x 2)
          # and only morning-board's 2 were reaching the repo, so the committed
          # log recorded the account balance without ever showing which caller
          # was spending it. Counters and timestamps only — no key material.
          git add data/closing_*.json data/odds_credits.json odds/
          git diff --cached --quiet || git commit -m "Closing lines $(date -u +%FT%TZ)"
          PUSH_WHAT="closing lines"
          # ---- PUSH EPILOGUE ----------------------------------------
          # Byte-identical at every retrying push point in the repository.
          # PUSH_WHAT is the only thing that varies; selftest_workflows.py
          # asserts the rest matches exactly, so the safest version cannot
          # drift into being the second-safest somewhere.
          #
          # main takes ~2 bot commits an hour and seven workflows push to it,
          # so a bare push can lose a race and strand the run. Commit FIRST
          # (done above, so the tree is clean), then rebase only when a push
          # actually loses. NEVER --autostash: it hides working-tree state, and
          # when its stash pop conflicts it exits 0 with UU markers in the tree,
          # which the old pre-staging `git pull` then staged, committed and
          # pushed to main.
          #
          # STOP ON CONFLICT. The ledger is append-only and football commitments
          # are frozen once recorded, so a conflict means something is genuinely
          # wrong and must reach a human rather than be auto-resolved. Losing one
          # run's output is a visible, recoverable incident; merge markers in the
          # ledger, the credit log or a commitment store are not.
          pushed=""
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git fetch origin main || exit 1
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase conflict during the $PUSH_WHAT push - stopping, not auto-resolving"
              exit 1
            fi
          done
          # THE EXHAUSTION GUARD. Without it, `for ... done` whose last command
          # is a successful rebase exits 0, so three lost races report SUCCESS
          # having pushed nothing. That was live in grade-ledger.yml and
          # instagram-recovery.yml until 2026-09-12. Proven in a scratch repo:
          # exit 0, three rejections, HEAD != origin/main.
          if [ -z "$pushed" ]; then
            echo "::error::$PUSH_WHAT push still rejected after 3 rebase attempts - nothing was pushed"
            exit 1
          fi

  # Same loud-failure rule as the board and grading runs (added 2026-08-17).
  # Lower stakes than those two — a missed capture costs precision on one
  # window's close, not a board or a ledger entry — but a silent failure is
  # still a silent failure, and this job is the one that had actually been
  # failing unnoticed: the 2026-08-16 22:30 UTC run died at "Commit closing
  # lines" (a push race on the shared data/ directory) and told nobody.
  # The message says what it really costs so three-a-day alerting can never
  # train anyone to ignore the channel.
  alert:
    needs: capture
    if: ${{ always() && needs.capture.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}   # ops channel; unset = alert not sent, never rerouted
        run: |
          set +e
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # gh's built-in --jq, not the standalone jq binary: one less thing that
          # can be missing on a runner and silently blank out the alert.
          Q_STEP='[.jobs[] | select(.name != "alert") | .steps[]? | select(.conclusion == "failure") | .name][0] // "unknown (no failing step reported)"'
          Q_JOB='[.jobs[] | select(.name != "alert") | select(.conclusion != "success") | .id][0] // empty'
          RUN_JOBS="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          STEP=$(gh api "$RUN_JOBS" --jq "$Q_STEP" 2>/dev/null)
          JOB_ID=$(gh api "$RUN_JOBS" --jq "$Q_JOB" 2>/dev/null)
          [ -n "$STEP" ] || STEP="unknown (could not read the run's jobs)"
          : > tail.txt
          if [ -n "$JOB_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > joblog.txt 2>/dev/null \
              && tail -n 20 joblog.txt > tail.txt
          fi
          python scripts/post_discord.py alert \
            "**Closing-line capture did not complete.** Failing step: \`$STEP\`. Run: $RUN_URL
          Impact is limited: games whose first pitch falls before the next capture keep an earlier line as their close, so their CLV is measured against a slightly stale number. No board, ledger or site content is affected, and the capture file is append-only — the next run picks up where this one stopped. If this repeats, look at the commit step: several capture runs share data/ with the board and grading jobs and can lose a push race." \
            --detail-file tail.txt
          exit 0

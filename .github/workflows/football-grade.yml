name: Football grade
# Refreshes results, grades finished slate weeks into the append-only football
# ledger, reveals their boards, and re-renders the pages.
#
# THIS IS THE RUN THAT MAKES THE PAYWALL HONEST. House Rule 7: held plays are
# held, not hidden. Withholding a pick before kickoff is the product;
# withholding it after is fraud. So the reveal is driven from here, by the same
# job that books the result, rather than by a person remembering to publish a
# loss. A reveal that depends on somebody feeling like it is a reveal that
# eventually does not happen.
#
# DAILY AT 11:00Z (~7am ET), which is after every US kickoff has finished,
# including a Monday night game on the west coast.
#
# ON GITHUB CRON, and here that is genuinely fine - the distinction that moved
# football-capture.yml to external dispatch does not apply. A missed capture
# window is unrecoverable: the price is gone. A missed grading run is not: the
# results are still on ESPN tomorrow, the captures are still on disk, and the
# next run books exactly the same entries. Lateness costs a day of delay, not
# evidence.
#
# APPEND-ONLY, AND THE GRADER ENFORCES IT. A slate week already in the ledger is
# refused rather than recomputed (House Rule 1). So re-running this is safe, and
# a week can never be quietly regraded into a better-looking number.
#
# SEASON TYPE IS FILTERED BY THE GRADER, not here. Preseason and bowls are
# fetched and stored so the refusal is auditable, then refused by name. See
# docs/FOOTBALL_PIPELINE.md section 3a.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: football-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    # THE ALERT JOB BELOW MUST NOT FIRE FOR A DATA-INTEGRITY FAILURE.
    #
    # It keys on `needs.grade.result != 'success'`, so without this output a
    # failing integrity step would Discord-alert — with a 20-line log tail —
    # on every grade run. During a persistent fault that is one a day forever, which is how
    # an ops channel gets muted. The daily monitor is the human notification
    # layer; these steps only turn the run red.
    #
    # The integrity step carries no `if:`, so it runs only when every step before
    # it succeeded (default `success()`), unlike the `!cancelled()` steps above
    # it. That is what makes this output safe to suppress on: `failed=true` can
    # ONLY mean the integrity check was the sole failure. A genuine pipeline
    # failure skips the step, leaves the output empty, and still alerts.
    outputs:
      integrity_failed: ${{ steps.integrity.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Football reset regression checks
        id: reset_checks
        run: python scripts/football/selftest_reset.py

      # A generous window rather than "yesterday": a game postponed into the
      # following week, or a run that failed for two days, must still be picked
      # up. Both fetchers key by event id and overwrite in place, so re-fetching
      # a day already stored changes nothing.
      - name: Work out the refresh window
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          start = (now - timedelta(days=12)).strftime("%Y%m%d")
          end = (now + timedelta(days=1)).strftime("%Y%m%d")
          print(f"REFRESH_RANGE={start}-{end}")
          PY
          echo "refreshing $REFRESH_RANGE"

      - name: Refresh NCAA FBS results
        run: python scripts/football/espn_ncaaf.py --dates "$REFRESH_RANGE"

      - name: Refresh NFL results
        if: ${{ !cancelled() }}
        run: python scripts/football/espn_nfl.py --dates "$REFRESH_RANGE"

      # Each sport grades independently: one sport's results feed being down
      # must not stop the other's week being booked.
      - name: Grade NCAA FBS
        if: ${{ !cancelled() && steps.reset_checks.outcome == 'success' }}
        env:
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
        run: python scripts/football/grade_football.py --sport ncaaf

      - name: Grade NFL
        if: ${{ !cancelled() && steps.reset_checks.outcome == 'success' }}
        env:
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
        run: python scripts/football/grade_football.py --sport nfl

      # The D.J. Mercer Spotlight: human picks on their own append-only record.
      # Reads the same two results stores refreshed above and never touches
      # football_ledger.json. Exits non-zero ONLY for a pick edited after its
      # fingerprint - after booking everything honest - so a tampered card
      # reaches the alert instead of passing quietly.
      - name: Grade the Mercer Spotlight
        if: ${{ !cancelled() }}
        env:
          # REQUIRED NOW THAT THE CARD IS SEALED. Grading has to decrypt the
          # card to re-hash it against the public commitment; without the key
          # it cannot verify, so it must not book. The render steps deliberately
          # do NOT get the key - a locked public card is built from
          # commitments.json alone, so a public build never needs to decrypt.
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
        run: python scripts/football/mercer.py grade

      # grade_committed reveals only after both selected positions have settled.
      # A partial sport result must never reveal the other sport early.

      - name: Render the football pages
        if: ${{ !cancelled() }}
        env:
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/football/page.py --all

      - name: Render the Mercer Spotlight
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          WHOP_CHECKOUT_URL: ${{ vars.WHOP_CHECKOUT_URL }}
        run: python scripts/football/mercer.py render

      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          # NO `git pull` HERE. It used to run at this point, BEFORE staging,
          # so the tree was dirty by construction and needed --autostash to move
          # at all. That hid two failures rather than one:
          # `git pull --rebase --autostash` EXITS 0 when the rebase succeeds but
          # the stash pop conflicts, leaving UU conflict markers in the working
          # tree and the stash undropped - so `|| true` was not even the thing
          # swallowing it. The step then staged, committed and pushed the markers
          # to main. Verified against real git in a scratch repo, and pinned by
          # scripts/football/selftest_push_pattern.py.
          # Sync happens in the push epilogue below instead, AFTER the commit,
          # when the tree is clean and a rebase needs nothing hidden.
          # board_*.json IS staged here, unlike in football-board.yml: after
          # grading the plaintext board is exactly what we are publishing, so
          # anyone can hash it and check it against the fingerprint committed
          # before kickoff.
          # ONE PATH PER `git add`, and this is not a style preference.
          # `git add a b c_*.json` where the glob matches NOTHING is fatal: git
          # exits 128 and stages NOTHING AT ALL, including the paths that were
          # fine. With `2>/dev/null || true` swallowing that, the step passes,
          # `git diff --cached --quiet` is true, and the job goes green having
          # committed nothing.
          #
          # THIS ACTUALLY HAPPENED, for eleven consecutive days. Between
          # 2026-08-27 and 2026-09-06 this job ran 11 times, succeeded every
          # time, and committed NOTHING - because data/football/board_*.json
          # matched no file while every board was still encrypted and
          # unrevealed. So results were never refreshed, nothing ever graded,
          # nothing was ever revealed, and two weeks of committed plays sat held
          # after they had settled. House Rule 7 says that is fraud, and the
          # cause was a shell idiom.
          #
          # Verified in a scratch repo: `git add real.txt also.txt board_*.json`
          # -> exit 128, nothing staged; the same paths added one at a time ->
          # both staged.
          for p in data/football/football_ledger.json \
                   data/football/commitments.json \
                   data/football/ncaaf_results.json \
                   data/football/nfl_results.json \
                   data/football/board_*.json \
                   data/mercer/ \
                   football/; do
            git add "$p" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "Football grade $(date -u +%F)"
          PUSH_WHAT="football grade"
          # ---- PUSH EPILOGUE ----------------------------------------
          # Byte-identical at every retrying push point in the repository.
          # PUSH_WHAT is the only thing that varies; selftest_workflows.py
          # asserts the rest matches exactly, so the safest version cannot
          # drift into being the second-safest somewhere.
          #
          # main takes ~2 bot commits an hour and seven workflows push to it,
          # so a bare push can lose a race and strand the run. Commit FIRST
          # (done above, so the tree is clean), then rebase only when a push
          # actually loses. NEVER --autostash: it hides working-tree state, and
          # when its stash pop conflicts it exits 0 with UU markers in the tree,
          # which the old pre-staging `git pull` then staged, committed and
          # pushed to main.
          #
          # STOP ON CONFLICT. The ledger is append-only and football commitments
          # are frozen once recorded, so a conflict means something is genuinely
          # wrong and must reach a human rather than be auto-resolved. Losing one
          # run's output is a visible, recoverable incident; merge markers in the
          # ledger, the credit log or a commitment store are not.
          pushed=""
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git fetch origin main || exit 1
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase conflict during the $PUSH_WHAT push - stopping, not auto-resolving"
              exit 1
            fi
          done
          # THE EXHAUSTION GUARD. Without it, `for ... done` whose last command
          # is a successful rebase exits 0, so three lost races report SUCCESS
          # having pushed nothing. That was live in grade-ledger.yml and
          # instagram-recovery.yml until 2026-09-12. Proven in a scratch repo:
          # exit 0, three rejections, HEAD != origin/main.
          if [ -z "$pushed" ]; then
            echo "::error::$PUSH_WHAT push still rejected after 3 rebase attempts - nothing was pushed"
            exit 1
          fi

      - name: Football join integrity
        id: integrity
        # AFTER THE PUSH, DELIBERATELY — not before it.
        #
        # The tempting ordering is "check, then commit only if clean". It was
        # rejected: House Rule 7 says a graded play is published in full after
        # grading, win or lose, and gating the push would withhold graded results
        # and the week's reveal because a REFERENCE table disagreed. team_join
        # compares nfl_results.json (which this run regenerates, step "Refresh
        # NFL results") against games.csv and team_game_efficiency.csv, both
        # static since 2026-08-20 and untouched here. A franchise mismatch in
        # those does not mean the grades are wrong, and it must not delay
        # publishing them.
        #
        # So the record publishes and the run goes red. A failure NEVER reverts
        # the push, repairs data, weakens an assertion, or posts to Discord.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python scripts/football/selftest_team_join.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=selftest_team_join.py::football reference datasets disagree (exit $rc); graded results remain committed and published"
            {
              echo "## Football join integrity"
              echo ""
              echo "❌ \`selftest_team_join.py\` failed (exit $rc)."
              echo ""
              echo "The football reference datasets disagree. **Graded results"
              echo "remain committed and published** — House Rule 7 — and nothing"
              echo "was reverted or repaired. No Discord alert was sent from here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit $rc
          fi
          echo "## Football join integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ \`selftest_team_join.py\` passed." >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs: grade
    if: ${{ always() && needs.grade.result != 'success'
          && needs.grade.outputs.integrity_failed != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}
        run: |
          set +e
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          Q_STEP='[.jobs[] | select(.name != "alert") | .steps[]? | select(.conclusion == "failure") | .name][0] // "unknown (no failing step reported)"'
          STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq "$Q_STEP" 2>/dev/null)
          [ -n "$STEP" ] || STEP="unknown (could not read the run's jobs)"
          python scripts/post_discord.py alert \
            "**Football grading did not complete.** Failing step: \`$STEP\`. Run: $RUN_URL
          Self-healing: results stay on ESPN, captures stay on disk, and tomorrow's run books the same entries. The ledger is append-only so nothing can be double-booked. What it costs is a day of delay. The part worth checking rather than waiting on is the reveal: until grading succeeds, that week's board stays REDACTED on the public page, and House Rule 7 says a graded play is published in full, win or lose. If this fails repeatedly, the site is holding back plays it has already settled."
          exit 0

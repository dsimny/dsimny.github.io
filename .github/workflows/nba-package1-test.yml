name: NBA Package 1 offline contracts
on:
  push:
    paths:
      - 'scripts/nba/**'
      - 'tests/nba/**'
      - 'docs/NBA_*.md'
      - '.github/workflows/nba-package1-test.yml'
  pull_request:
    paths:
      - 'scripts/nba/**'
      - 'tests/nba/**'
      - 'docs/NBA_*.md'
      - '.github/workflows/nba-package1-test.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography tzdata
      - run: python -B -m unittest discover -s tests/nba -v

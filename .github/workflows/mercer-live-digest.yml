name: Mercer Live digest + manifest commit (ML-1-OPS)
# Package ML-1-OPS, mercer-live-ml1-ops-v1.0 (docs/MERCER_LIVE_ML1_OPS.md).
# mercer-live-ml1-v1.0 is FROZEN and unchanged; this workflow only publishes
# its output.
#
# Commits exactly TWO files for one closed ET date, in ONE commit:
#   data/mercer_live/digest/<date>.json    the frozen ml1-v1 digest, as the host built it
#   data/mercer_live/manifest/<date>.json  the ML-1-OPS manifest (ml1-ops-manifest-v1),
#                                          bound one-way to that digest by its SHA-256
# The shared commit IS the pairing; the frozen digest never names the manifest.
#
# WHO BUILDS AND WHO COMMITS. The capture host holds the raw bytes and builds
# both files (scripts/mercer_live_ops/archive.py build); it publishes them to a
# private digest bucket. This job holds the repository write and nothing else:
# it downloads the two candidates with a READ-ONLY credential scoped to that
# bucket, validates them (scripts/mercer_live_ops/digest_commit.py) and
# commits them. The host never holds a credential that could push index.html,
# a ledger or a commitment store, and this job never sees a raw observation.
#
# GROW, NEVER CHANGE. A committed pair is replaced only by a pair that keeps
# every committed entry byte-for-byte and adds evidence; anything else is
# REFUSED-DIFFERS and the run goes red. git history keeps every version.
#
# TRIGGER. workflow_dispatch only, fired daily by cron-job.org after the host's
# 06:30 ET publish. No GitHub `schedule:` (measured 15-23 minutes late here).
# A missing candidate is a red run, which is the alert.
#
# LOGS. Only the date, the action, counts and hashes are printed.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "ET date to commit (YYYY-MM-DD); blank = yesterday ET"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mercer-live-digest
  cancel-in-progress: false

jobs:
  commit:
    name: Commit one digest + manifest pair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the date
        id: d
        env:
          IN_DATE: ${{ inputs.date }}
        run: |
          set -eu
          if [ -n "$IN_DATE" ]; then D="$IN_DATE"; else D=$(TZ=America/New_York date -d yesterday +%F); fi
          case "$D" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::date must be YYYY-MM-DD"; exit 1 ;;
          esac
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Fetch the published candidates (read-only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML1_DIGEST_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML1_DIGEST_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.ML1_R2_ENDPOINT }}
          BUCKET: ${{ vars.ML1_DIGEST_BUCKET }}
          D: ${{ steps.d.outputs.date }}
        run: |
          set -eu
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$BUCKET" ]; then
            echo "::error::digest bucket not configured (ML1_DIGEST_R2_* secrets, ML1_R2_ENDPOINT, ML1_DIGEST_BUCKET)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ml1"
          for k in digests manifests; do
            if aws s3 cp "s3://$BUCKET/$k/$D.json" "$RUNNER_TEMP/ml1/$k.json" \
                 --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
              echo "fetched $k candidate for $D"
            else
              echo "no $k candidate fetched for $D"
            fi
          done
      - name: Validate and place the pair
        env:
          PYTHONIOENCODING: utf-8
          D: ${{ steps.d.outputs.date }}
        run: >-
          python scripts/mercer_live_ops/digest_commit.py --date "$D"
          --candidate-digest "$RUNNER_TEMP/ml1/digests.json"
          --candidate-manifest "$RUNNER_TEMP/ml1/manifests.json"
      - name: Commit the digest and manifest
        run: |
          set -e
          D="${{ steps.d.outputs.date }}"
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          # EXACTLY TWO PATHS, named literally, in ONE commit - that commit is
          # the digest/manifest pairing. A literal path that is missing exits
          # 128 and turns the run red, which is loud and therefore fine.
          git add "data/mercer_live/digest/$D.json"
          git add "data/mercer_live/manifest/$D.json"
          # The index must hold both paths or neither, and nothing else, before
          # anything is committed. index.html, feed.xml and every ledger are
          # never this workflow's to touch.
          staged="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          want="$(printf '%s\n' "data/mercer_live/digest/$D.json" "data/mercer_live/manifest/$D.json" | sort | tr '\n' ' ')"
          if [ -n "$staged" ] && [ "$staged" != "$want" ]; then
            echo "::error::staged set is not exactly the digest+manifest pair - refusing to commit"
            exit 1
          fi
          git diff --cached --quiet || git commit -m "Mercer Live digest + ML-1-OPS manifest ${D}"
          PUSH_WHAT="Mercer Live digest"
          # ---- PUSH EPILOGUE ----------------------------------------
          # Byte-identical at every retrying push point in the repository;
          # selftest_workflows.py asserts it. See capture-closing.yml for the
          # reasoning behind every line.
          pushed=""
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git fetch origin main || exit 1
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase conflict during the $PUSH_WHAT push - stopping, not auto-resolving"
              exit 1
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error::$PUSH_WHAT push still rejected after 3 rebase attempts - nothing was pushed"
            exit 1
          fi

name: Football incident member correction
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: football-member-correction-2026-09-13
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send fixed authorized notice with durable duplicate guard
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}
        run: python scripts/football/member_correction.py

name: Grade ledger
# Runs daily at 08:10 UTC (4:10 AM ET) — after the last West Coast game ends.
# Grades yesterday's published picks against final scores and updates the
# append-only ledger, then rebuilds the site so the record is live by morning.
on:
  # Triggered by cron-job.org via the workflow_dispatch API, daily at 4:10 AM ET.
  # GitHub cron removed 2026-07-23 (see morning-board.yml: late + duplicate posts).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    # Needed to decrypt yesterday's board for grading, and to reveal it after.
    env:
      BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Grade yesterday's picks
        run: python scripts/grade.py
      - name: Rebuild site with updated ledger
        env:
          DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}   # optional — join prompt is omitted when unset
          WHOP_CHECKOUT_URL: ${{ vars.WHOP_CHECKOUT_URL }}   # optional — upgrade button omitted when unset
        run: |
          # Rebuild against the most recent board so the ledger tab refreshes.
          # Matches .enc as well as .json: today's board is still encrypted at
          # this hour, and only yesterday's has been revealed.
          LATEST=$(ls data/board_*.json data/board_*.enc 2>/dev/null \
                   | sed -E 's#.*board_(.*)\.(json|enc)$#\1#' | sort -u | tail -1)
          if [ -n "$LATEST" ]; then python scripts/build_site.py "$LATEST"; fi
      - name: Re-render blog pages
        # --rebuild-only: adds no post (today's belongs to the morning board
        # run), just re-renders blog/ from the store and re-merges the blog
        # items into feed.xml, which build_site's feed update above rewrote
        # from the pick store alone.
        env:
          SITE_URL: ${{ vars.SITE_URL }}   # optional
        run: python scripts/blog.py --rebuild-only
      - name: Complete yesterday's game pages (the reveal)
        # Regenerates the same URLs with the revealed picks, closing lines,
        # ledger results, and postgame notes. Yesterday in ET, not UTC — the
        # run happens at 4:10 AM ET.
        run: python scripts/game_pages.py "$(TZ=America/New_York date -d yesterday +%F)"
      - name: Export training rows
        # Point-in-time feature rows from the just-revealed board + finals,
        # for the future challenger/calibration model. First run backfills
        # every revealed board; nightly runs append yesterday.
        run: python scripts/export_training_rows.py "$(TZ=America/New_York date -d yesterday +%F)"
      - name: Grade pick'em and post the leaderboard
        # Pulls entries from the Worker, grades against the revealed board +
        # final score, pushes per-user results back (names stay in the Worker),
        # commits aggregates to data/pickem.json. Skips cleanly until the
        # Worker URL + token secrets exist.
        env:
          PICKEM_WORKER_URL: ${{ secrets.PICKEM_WORKER_URL }}     # optional — pick'em dark until set
          PICKEM_READ_TOKEN: ${{ secrets.PICKEM_READ_TOKEN }}     # optional
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}     # optional
          PICKEM_CHANNEL_ID: ${{ vars.PICKEM_CHANNEL_ID }}        # optional
        run: python scripts/grade_pickem.py
      - name: Post results recap to Discord
        env:
          DISCORD_WEBHOOK_URL_LEDGER: ${{ secrets.DISCORD_WEBHOOK_URL_LEDGER }}   # results channel; falls back to DISCORD_WEBHOOK_URL if unset
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                 # optional fallback
          SITE_URL: ${{ vars.SITE_URL }}                                          # optional
        run: python scripts/post_discord.py recap
      - name: Post record to X
        # Yesterday's results + running ledger as a text post. Idempotent (records
        # "posted" in data/post_status.json); skips cleanly if the keys are unset;
        # never fails the grading run.
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}             # optional — X post skipped when unset
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}                  # optional
        run: python scripts/post_social.py x
      - name: Post record to Facebook
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}                          # optional — FB post skipped when unset
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}                              # optional
        run: python scripts/post_social.py facebook
      - name: Commit ledger and site
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html feed.xml blog/ picks/
          git diff --cached --quiet || git commit -m "Grade $(date -u -d yesterday +%F)"
          git push

  # Same loud-failure rule as the morning board (added 2026-08-17). A grading
  # run that dies leaves yesterday's picks ungraded and unrevealed — House Rule 7
  # territory — so it must reach a human the same day, not whenever someone
  # happens to open the Actions tab.
  alert:
    needs: grade
    if: ${{ always() && needs.grade.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}     # optional — ops channel
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}   # fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                   # last-resort fallback
        run: |
          set +e
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # gh's built-in --jq, not the standalone jq binary: one less thing that
          # can be missing on a runner and silently blank out the alert.
          Q_STEP='[.jobs[] | select(.name != "alert") | .steps[]? | select(.conclusion == "failure") | .name][0] // "unknown (no failing step reported)"'
          Q_JOB='[.jobs[] | select(.name != "alert") | select(.conclusion != "success") | .id][0] // empty'
          RUN_JOBS="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          STEP=$(gh api "$RUN_JOBS" --jq "$Q_STEP" 2>/dev/null)
          JOB_ID=$(gh api "$RUN_JOBS" --jq "$Q_JOB" 2>/dev/null)
          [ -n "$STEP" ] || STEP="unknown (could not read the run's jobs)"
          : > tail.txt
          if [ -n "$JOB_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > joblog.txt 2>/dev/null \
              && tail -n 20 joblog.txt > tail.txt
          fi
          python scripts/post_discord.py alert \
            "**Grading run did not complete.** Failing step: \`$STEP\`. Run: $RUN_URL
          Yesterday's board may still be unrevealed and its picks ungraded. Nothing has been written to the ledger — grade.py writes nothing when it aborts — so a re-run is safe." \
            --detail-file tail.txt
          exit 0

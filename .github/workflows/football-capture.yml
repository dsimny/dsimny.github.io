name: Football capture and board
# ONE workflow, TWO halves, and the order between them is deliberate.
#
#   HALF 1  capture NFL and NCAA FBS moneyline prices into data/football/odds/.
#           A T-24 window that closes with no capture in it is GONE, and
#           re-acquiring it means buying historical odds again. This is the only
#           unrecoverable step in the whole pipeline.
#   HALF 2  freeze newly-evaluable games at their T-24, write the week's board
#           once the decision moment has passed, render the pages, and deliver
#           to Discord.
#
# MERGED FROM A SEPARATE football-board.yml ON 2026-08-26, because GitHub's
# scheduler is not reliable in this repo. Measured: football-board.yml sat at
# ZERO runs for nine and a half hours on an hourly cron, while capture - which
# also has an external cron-job.org trigger - fired every hour. The board is now
# driven by the trigger that demonstrably works rather than the one that does
# not, and there is one external entry to maintain instead of two.
#
# CAPTURES ARE COMMITTED BEFORE THE BOARD RUNS, and that is the whole reason
# this merge is safe. The risk of putting slow work in the same job is that a
# hang in half 2 tears down the runner with half 1's evidence still on it,
# unpushed - losing the one thing that cannot be re-fetched. So there are two
# commit steps: prices are pushed the moment they exist, before anything else is
# attempted.
#
# WHAT IT ACTUALLY DECIDES. scripts/football/capture_schedule.py reads each
# game's real kickoff from ESPN and derives two windows per game:
#     T-24    [kickoff-30h, kickoff-18h]
#     closing [kickoff-6h,  kickoff]
# It fires ONE capture per sport only if some window is open with no capture
# already inside it. One capture returns the whole board and therefore satisfies
# many games at once, which is why an hourly job does not mean hourly spending.
# Those bounds mirror grade_football.py; if they ever drift, the grader wins.
#
# --eager, DELIBERATELY, and this is a decision the credit correction unlocked.
# The script's default is to wait until the most urgent open window is within
# ~2h of closing, which is the point of maximum overlap and the cheapest way to
# run. That default assumed credits were scarce. They are not: the Odds API is
# on a paid 100,000/month plan (see CLAUDE.md) and football needs ~208. Against
# that, --eager costs at most ~720 credits/sport/month in the pathological case
# and buys the thing that actually matters here - slack. GitHub's scheduler is
# known in this repo to fire hours late (the reason the board run was moved off
# it on 2026-07-23), and "hours late" against a 2h lead is a missed window.
# Firing as soon as anything is open means a late run still lands inside the
# window. Trading credits we have for windows we cannot get back is the right
# way round.
#
# TRIGGERING: EXTERNAL DISPATCH IS PRIMARY, GITHUB CRON IS THE BACKSTOP.
#
# This was originally shipped on GitHub cron alone, citing heartbeat.yml as
# precedent. THAT WAS THE WRONG PRECEDENT and the error is recorded here rather
# than quietly fixed, because the reasoning is the useful part. heartbeat is a
# WATCHDOG: it asks once a day whether a board exists, and a watchdog that runs
# late is still a watchdog. Both PRODUCTION jobs deliberately do not use GitHub
# cron at all -
#
#     morning-board.yml    on: workflow_dispatch: {}   only
#     capture-closing.yml  on: workflow_dispatch: {}   only
#
# - and morning-board says why in its own comment: GitHub's cron was removed
# 2026-07-23 for firing hours late. Measured 2026-08-26, the picture is:
#     heartbeat (schedule)      9/9 fired, consistently 15-23 min late
#     morning-board (dispatch)  15:10:08, 15:10:08, 15:10:08 - to the second
#     capture-closing (dispatch) 01:30:10, 22:30:10, 16:30:11
#     the separate board job (schedule)  ZERO runs in nine and a half hours
#
# --eager mitigates lateness. It cannot mitigate a run that never happens, and
# this is the one job in the repo whose missed window is unrecoverable. So it
# gets the mechanism the repo already trusts for work that must actually occur.
#
# THE EXTERNAL ENTRY IS LIVE: cron-job.org dispatches this workflow hourly at
# :37, alongside the morning-board and capture-closing entries. That is the
# primary trigger and it is why the board half was folded in here.
#
# THE SCHEDULE BELOW STAYS as a second, independent trigger. Two triggers cannot
# double-spend: the second run finds the window already satisfied by the first
# and fires no call, and every board step declines to repeat work already done.
# For an unrecoverable job, redundancy at a cost of zero credits is the right
# trade.
#
# A MISSING ODDS_API_KEY FAILS THIS RUN, on purpose, and this is a deliberate
# departure from the MLB jobs where a missing key no-ops cleanly. There the cost
# is one day's prices and a blank CLV column. Here the cost is a permanently
# ungradeable game. fetch_odds.py calls localenv.require(), which raises, and the
# alert job below says so.
#
# PRESEASON IS CAPTURED AND NEVER GRADED (FOOTBALL_PIPELINE.md section 3a).
# Capturing it is a free rehearsal of this whole path against real games; the
# allowlist in the grader is what keeps it out of the ledger. Note one known
# seam, not worth engineering around for the few days it exists: ESPN's NFL
# scoreboard lists preseason games, but the Odds API prices them under a separate
# sport key (americanfootball_nfl_preseason), so a preseason-driven window may
# fire a call that returns regular-season events instead. The capture is still
# valid; only the rehearsal is less exact.
on:
  schedule:
    - cron: "7 * * * *"     # hourly, at :07 - off the top of the hour, where
                            # GitHub's scheduler is most congested.
  workflow_dispatch: {}

permissions:
  contents: write

# Several jobs share data/ and push to the same branch. Queue rather than cancel:
# a cancelled capture is a possibly-missed window, which is the one outcome this
# job exists to prevent.
concurrency:
  group: football-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Report first, unconditionally and without --run. Costs nothing, spends
      # nothing, and puts the window state in the log for every run - including
      # the runs that decide to do nothing. When a window IS eventually missed,
      # this is the record of what the scheduler believed at the time.
      - name: Report window state (no spend)
        run: |
          python scripts/football/capture_schedule.py --sport ncaaf --days 8
          python scripts/football/capture_schedule.py --sport nfl   --days 18

      - name: Capture NCAA FBS if due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/football/capture_schedule.py --sport ncaaf --days 8 --eager --run

      # !cancelled() rather than always(): if NCAAF failed, NFL still gets its
      # chance, because the two sports' windows are independent and one broken
      # call must not cost the other a window. The job still fails overall.
      - name: Capture NFL if due
        if: ${{ !cancelled() }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/football/capture_schedule.py --sport nfl --days 18 --eager --run

      # Also !cancelled(): a capture that succeeded before a later step failed is
      # still evidence, and leaving it on a torn-down runner throws away the one
      # thing this job cannot re-fetch.
      - name: Commit captures
        if: ${{ !cancelled() }}
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true   # shares data/ with the board, grade and closing jobs
          # odds_credits.json MUST be staged here. fetch_odds.py writes a reading
          # on every call, but an unstaged reading dies with the runner - the
          # exact defect that hid capture-closing's spending until 2026-08-20.
          # Counters and timestamps only; no key material. The paid-data
          # directories under data/football/ are gitignored, so this add cannot
          # publish them.
          git add data/football/odds/ data/odds_credits.json
          git diff --cached --quiet || git commit -m "Football lines $(date -u +%FT%TZ)"
          git push

      # ---------------- half 2: the board ----------------
      # Everything below is recoverable. If any of it fails the next hourly run
      # redoes it, and the prices from half 1 are already safely pushed.

      - name: Work out the current slate week
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import sys
          sys.path.insert(0, "scripts/football")
          import market
          print(f"SLATE_WEEK={market.slate_week(market.now_utc())}")
          PY
          echo "slate week: $SLATE_WEEK"

      # Freezes newly-evaluable games at their own T-24, and writes the board
      # once the decision moment (Saturday 14:00 US/Eastern) has passed. Both
      # are no-ops when there is nothing to do, so this is safe every hour.
      #
      # BOARD_ENCRYPTION_KEY IS REQUIRED. crypto_box.refuse_plaintext_in_ci()
      # sees GITHUB_ACTIONS and raises rather than writing picks in the clear.
      # That is the correct direction to fail: no board is a bad day, a board
      # published unencrypted before kickoff is the product given away.
      # ANTHROPIC_API_KEY is optional - without it the board publishes its
      # numbers and every game reads "no writeup (no API key configured)".
      - name: Build the board
        if: ${{ !cancelled() }}
        env:
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OLS_WRITEUP_MODEL: ${{ vars.OLS_WRITEUP_MODEL }}
        run: python scripts/football/board.py --sports nfl,ncaaf --writeups

      # Always re-render, not only when a board was just written: a week's page
      # changes when GRADING flips its commitment to revealed, which happens in
      # football-grade.yml days later.
      - name: Render the football pages
        if: ${{ !cancelled() }}
        env:
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          WHOP_CHECKOUT_URL: ${{ vars.WHOP_CHECKOUT_URL }}
        run: python scripts/football/page.py --all

      - name: Post the free play
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/football/discord.py free --week "$SLATE_WEEK"

      - name: Post the full slate to members
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}
          BOARD_ENCRYPTION_KEY: ${{ secrets.BOARD_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/football/discord.py slate --week "$SLATE_WEEK"

      - name: Commit the board and pages
        if: ${{ !cancelled() }}
        run: |
          git config user.name "openledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          # data/football/board_*.json is NOT staged: a plaintext board before
          # its reveal is the one thing that must never be committed, and in CI
          # crypto_box refuses to write one anyway. Grading stages it later,
          # after the reveal, which is when publishing it is the point.
          git add data/football/board_*.enc                   data/football/commitments.json                   data/football/game_commitments.json                   data/post_status.json                   football/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Football board $SLATE_WEEK"
          git push

  # Loud failure, same rule as the board, grading and closing runs. The impact
  # line is written to be TRUE rather than reassuring: this is the one job whose
  # failure destroys something, so it must not read like the closing-capture
  # alert, which is genuinely low-stakes.
  alert:
    needs: capture
    if: ${{ always() && needs.capture.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL_ALERTS: ${{ secrets.DISCORD_WEBHOOK_URL_ALERTS }}     # optional — ops channel
          DISCORD_WEBHOOK_URL_MEMBERS: ${{ secrets.DISCORD_WEBHOOK_URL_MEMBERS }}   # fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                   # last-resort fallback
        run: |
          set +e
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          Q_STEP='[.jobs[] | select(.name != "alert") | .steps[]? | select(.conclusion == "failure") | .name][0] // "unknown (no failing step reported)"'
          Q_JOB='[.jobs[] | select(.name != "alert") | select(.conclusion != "success") | .id][0] // empty'
          RUN_JOBS="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          STEP=$(gh api "$RUN_JOBS" --jq "$Q_STEP" 2>/dev/null)
          JOB_ID=$(gh api "$RUN_JOBS" --jq "$Q_JOB" 2>/dev/null)
          [ -n "$STEP" ] || STEP="unknown (could not read the run's jobs)"
          : > tail.txt
          if [ -n "$JOB_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > joblog.txt 2>/dev/null \
              && tail -n 20 joblog.txt > tail.txt
          fi
          python scripts/post_discord.py alert \
            "**Football run did not complete.** Failing step: \`$STEP\`. Run: $RUN_URL
          WHICH HALF FAILED DECIDES HOW URGENT THIS IS, so read the step name above before anything else.
          CAPTURE steps ('Report window state', 'Capture NCAA FBS if due', 'Capture NFL if due', 'Commit captures') are NOT self-healing. If a game's T-24 or closing window closes with no capture inside it, that price is gone and the game is permanently ungradeable — the only way back is buying historical odds. Check it now rather than at the end of the day. The 'Report window state' step prints how many windows are OPEN NOW and how many are already MISSED. Fixing a key or quota problem and re-running by hand still saves every window that has not closed yet.
          BOARD steps ('Build the board', 'Render the football pages', either Discord post, 'Commit the board and pages') ARE self-healing: the next hourly run redoes them, the captures are already committed, and each step declines to repeat work already done. That costs delay, not evidence. Two things still worth checking rather than waiting on: a BOARD_ENCRYPTION_KEY error means the secret has gone missing and no board can be written at all, and if this is the run at the decision moment then members are waiting on a slate that has not been sent.
          A 'WRITEUP FAILURE' line in the log is a DIFFERENT case and needs no rush: the board, its fingerprint and its commitment were all published, the pages rendered and members got the slate. Only the prose is missing, and the run went red on purpose so that this reaches you instead of the writeups quietly disappearing. It means a key IS configured but most of the slate came back empty — check that ANTHROPIC_API_KEY has not expired, that the account has credit, and that OLS_WRITEUP_MODEL names a real model. One or two games missing prose is the numeral validator doing its job, not a fault, and does not trigger this.
          Re-run by hand at Actions → Football capture and board → Run workflow." \
            --detail-file tail.txt
          exit 0
